name: Bug report
description: Jobwatch shows the wrong thing, or nothing
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Jobwatch and VS Code versions
      description: The Jobwatch version is in the Extensions panel and on the log's first line (`Jobwatch X.Y.Z activated`).
      placeholder: Jobwatch X.Y.Z, VS Code X.Y, macOS / Windows / Linux
    validations:
      required: true
  - type: textarea
    id: shown
    attributes:
      label: What the status bar shows
      description: The item's text and its tooltip, or a screenshot.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Jobwatch log
      description: |
        Run **Jobwatch: Show Log** and paste the last few lines. The log never contains your token,
        but it can include job names and hardware, so check it before posting.
      render: text
    validations:
      required: true
